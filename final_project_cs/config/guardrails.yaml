  density:
    # 여행 일정 점유 연구의 Low 관측치(약 40%)를 기준으로 한 운영 구간.
    # Low는 원문 관측값, 나머지는 Low~High 사이의 단계적 운영 구간이다.
    policy_id: density-research-calibrated-v1.2
    research_as_of: "2026-09-22"
    evidence:
      occupation_source: arxiv_1706_05518
      occupation_low_observed: 0.40
      travel_share_observed: 0.10
      buffer_percentile: 0.95
      mobility_rest_source: dft_inclusive_mobility_2022
      mobility_rest_minutes_per_30m: 2
      reservation_arrival_source: louvre_group_entry_guidance_2024
      reservation_arrival_minutes: 30
      restaurant_arrival_source: first_table_guidelines_2026
      restaurant_arrival_minutes: 15
      first_visit_orientation_source: louvre_group_entry_guidance_2024
      first_visit_orientation_minutes: 30
    targets:
      low: 0.40
      normal: 0.55
      high: 0.70
      very_high: 0.80
    # ★`[2026-10-03 사용자 지시 · D-019 개정]` 자동 변경(감시)이 하루 밀도를 **나쁘게 만드는지** 볼 때의 기준(`density.density_regressions` · `itinerary_fit`).
    #   등록·조회는 여전히 관측만 한다. ★출처: 아래 두 값은 **우리가 고른 값**이다(측정 안 함) — 근거 없이 정한 값이라 바꿀 수 있게 여기 둔다.
    gate:
      # soft: 밀도를 나쁘게 만드는 안은 순위에서 뒤로 밀고, **더 나은 안이 하나도 없을 때만** 감수하며 알림에 적는다(고장 난 항목을 그대로 두는 것이 더 나쁘다).
      # hard: 구조 위반(겹침 · 이동 불가)처럼 막는다 — 다 걸리면 「그대로 두었어요」.
      mode: soft
      # 이미 목표를 넘은 날에서 이 비율보다 더 넘기면 「더 나빠졌다」로 본다. 0.02 = 하루 12시간 창에서 약 14분. 이보다 작은 흔들림은 일정 하나를 바꿀 때마다 생기는 잡음이라 본다.
      worsen_tolerance: 0.02
  # ★`[2026-10-03]` 일정 **품질 경고**(`itinerary_quality`) — 거절하지 않고 화면 「살펴볼 점」(`warnings`)으로 알린다. 체크리스트 T7(끼니) · T8(같은 곳 두 번) · T9(왔다 갔다).
  #   ★아래 값은 **우리가 고른 값**이다(측정 안 함). 외부 연구(AI 일정 하루의 같은 곳 두 번 5.1% · 지그재그 9.5%)가 흔한 결함이라고 한 것을 잡되, 잡음을 줄이려고 넉넉히 잡았다.
  #   재볼 방법: `eval/` 에서 결함일 비율을 재 보고(체크리스트 v2 §7) 이 값을 조정한다.
  quality:
    # 끼니 — 그날의 첫 일정이 창 시작 이전이고 마지막 일정이 창 끝 이후인데(하루가 창을 통째로 덮는데) 식사(`dining`)가 창과 겹치지 않으면 알린다
    meal_windows:
      lunch: ["11:30", "14:00"]
      dinner: ["17:30", "20:30"]
    # 하루 항목(이동 제외)이 이보다 적으면 부분 일정(도착 저녁 · 반일 투어)으로 보고 끼니를 안 본다
    meal_min_items: 2
    # ★`[2026-10-03 적대 검토]` 그 시간대에 **식사 항목은 없어도 비어 있는 틈이 이만큼(분) 이상이면** 끼니 경고를 내지 않는다 — 점심을 일정표에 안 적고 자유 시간으로 두는 일정이 흔하다.
    #   틈이 이보다 짧아 다른 일정이 시간대를 채우면 「식사할 틈이 없다」로 알린다. 한 끼 길이(`planner.MEAL_MIN` 60분)와 같다. **우리가 고른 값**(측정 안 함)
    meal_min_gap_minutes: 60
    # 왔다 갔다 — 그날 활동 장소를 도는 길이가 가장 짧은 순서의 길이보다 `ratio` 배 이상이고 `min_extra_m` 이상 더 멀면 알린다.
    #   `max_stops` 초과는 안 본다(순서를 다 세어 보는 방식이라 8곳이 4만 가지) · 시간이 정해진 일정(예약 · 고객이 고정)이 둘 이상이면 순서를 못 바꾸므로 안 본다
    zigzag:
      min_stops: 3
      max_stops: 8
      min_extra_m: 3000
      ratio: 1.5
  # 바깥 호출 상한(초). ★reliability.team_timeout_seconds(90) 보다 작아야 한다 —
  #   안 그러면 Team 이 먼저 죽어 어느 소스가 늦었는지 못 가른다.
  source_timeout_seconds: 8
  # ★같은 요청의 응답을 몇 초 동안 재사용하나. 감시 루프 한 틱이 항목 여럿을 점검할 때
  #   특보(인자 없음)·대기질(시도 단위)·지진(날짜 단위)이 같은 요청을 연달아 보냈고,
  #   둘째부터 속도 제한에 걸려 「모름」→ 치명이 됐다(2026-09-14 실측). 0 이면 끈다.
  # ★출처: **우리가 고른 값**이다. 특보·대기질이 대개 시간 단위로 갱신되니 5분이면
  #   놓치는 것이 작다고 봤다 — 측정은 안 했다.
  source_cache_seconds: 300
  # 버스 도착정보 재사용 30초(설계값). 조회·제공 시각을 함께 내며 미래 시간표로 쓰지 않는다.
  bus_arrival_cache_seconds: 30
  # 현재 승차 관측용 지하철 보관 기간. 공급 생성 시각의 나이 상한은 별도로 검사한다.
  subway_arrival_cache_seconds: 30
  # ★`[2026-10-03 사용자]` 응답 캐시를 **프로세스를 건너 공유**한다(true) — DB 표 `source_response_cache`(마이그레이션 042). 일꾼이 회차마다 새 프로세스라 메모리 캐시는 틱 사이에 비어 있었고
  #   고객 요청 경로와도 나누지 못했다. 공개 소스(기상 · 대기질 · 특보 · 지진 · 재난문자 · 교통 · 공휴일)만 담고, DB 가 안 되면 메모리 캐시로 계속한다. false 면 전처럼 메모리만.
  # ★효과(계산 — 측정 아님): 위 유지 시간(300초)이 감시 주기(180초)보다 길어 **틱 둘에 한 번만** 새로 받는다 — 받아 쓰는 값은 늘 180초 이하다. 재난문자만 위 20분을 그대로 쓴다(설계값).
  source_cache_shared: true
  # ★재난문자만 길게 둔다 — 하루 한도가 100 으로 낮다(`[미확인]`, 같은 플랫폼 다른 API
  #   사용기). 20분이면 하루 최대 72회. 감시 루프는 90분 앞을 보니 20분 늦음은 견딘다고 봤다.
  # ★출처: **우리가 고른 값**이다.
  disaster_msg_cache_seconds: 1200
  # ★관광공사(장소 · 운영시간 원문)만 길게 — 하루 한도 1000(`[미확인]` 보수값)을 계획 읽기 · 일정 짜기 · 채팅이 나눠 쓴다.
  #   같은 장소를 되풀이해 물으면 둘째부터 한도를 안 쓴다. 프로세스 메모리에만 둔다(저장하지 않는다).
  # ★출처: **우리가 고른 값**(2026-09-28) — 운영시간이 하루 안에 바뀌는 일은 드물고, 당일 판정은 새벽 구글 확인이 한다.
  # ★`[2026-10-14 사용자 지시]` 6시간 → **하루**. 관광공사 장소는 잘 안 바뀌어 하루 1회 일일 정기점검(03시)에서 새로 받으므로, 요청 자리에서 부른 값도 하루 동안 다시 쓴다.
  tour_api_cache_seconds: 86400
  # ★한 번에 몰려 나갈 수 있는 호출 수(소스마다). 하루 합계는 여전히 한도 안이다
  #   (`ratelimit.interval_for` 가 몰림만큼 보충을 줄인다). 1 이면 고정 간격 그대로다.
  # ★출처: **우리가 고른 값** — 한 틱에 점검할 항목 수(90분 안에 시작하는 일정)를 넉넉히 덮는 수.
  rate_burst: 10
  # ★`[2026-10-05 사용자 지적]` env 의 하루 한도(`ACOP_RATE_*_PER_DAY`)를 **프로세스를 건너 DB 로 센다**(true) — `source_budget.py`.
  #   `rate_burst` 가 보여 주듯 프로세스 안 제한기는 일꾼이 새로 뜰 때마다 꽉 찬 채로 시작해 한도를 못 지켰다(ITS 한도 초과 9/30 937건 · 10/2 825건).
  #   하루는 한국 시각 자정에 바뀐다. false 면 끈다. ★예산이 차면 바깥으로 **나가지 않는다**(해당 소스는 「모름」).
  source_budget_shared: true
  # ★예산을 못 읽을 때(DB 오류)의 규칙. allow = 프로세스 안 제한기만으로 나간다(기본 — 이 층 도입 전과 같다, 더 나빠지지 않는다. 한도를 못 지킬 수 있다) ·
  #   refuse = 호출하지 않는다(한도를 무조건 넘지 않지만 DB 오류 동안 이 목록의 소스가 전부 「모름」 → 도로 사건 감시 치명으로 번진다).
  #   ★사용자 결정 대기(2026-10-05) — 결정 전까지 allow. 이동 세션은 refuse 로 초안을 썼고 코어가 allow 로 바꿨다(이유: `source_budget.py` 머리말).
  source_budget_on_db_error: allow
  # ★DB 로 세는 소스(어댑터 이름 = env 한도 이름). 키가 있고 하루 한도가 낮은 공공 API 들 — 여기 없는 소스는 안 센다.
  #   빠진 것: `open_meteo`·`open_meteo_air`(키 없음 · 하루 10,000 · 장소마다 불러 DB 쓰기만 늘어난다) · `kakao`(자체 예산 `kakao_budget` 이 있다) · 구글(자체 예산).
  source_budget_sources: [its, utic, subway_notice, seoul_subway_arrival, seoul_bus_arrival, tour_api, kma, kma_warning, kma_earthquake, airkorea,
                          khoa, tago, airport, mofa, kasi_holiday, disaster_msg, heritage_khs,
                          serpapi]   # `[2026-10-13]` SerpApi(구글 호텔 · 구글 항공권 공용) — 무료 월 250회
  # ★소스마다 몰림 허용을 따로 줄 때(없으면 `rate_burst`). 하루 합계는 여전히 그 소스 한도 안이다.
  #   관광공사: 계획 읽기 한 건이 장소마다 연달아 부른다 — 9개 질의에 11번(2026-09-27 실측). 10 으로는
  #   11번째가 거절됐다. 30 이면 접수 둘이 연달아 와도 들어간다. 보충 간격은 86.4초 → 89.0초로 늘어난다.
  # ★출처: **우리가 고른 값**.
  rate_burst_by_source:
    tour_api: 30
    # `[2026-10-13]` SerpApi — 「바꿔 줘」 한 번이 목록 1 + 상세 최대 3 을 연달아 부른다. 하루 합계는 DB 줄(8)이 지킨다
    serpapi: 8
  # ── 위임 범위 (v11 §12 DoD-18~21 · wiki `teams/booking-handoff.md` 「위임 범위」) ──
  # ★무엇을 재는 값인가. 승인 뒤 **공급자 원장을 사람 손 없이 바꾸는 분기**(자동 실행)가
  #   열리는 한계다. 여기를 하나라도 벗어나면 원장을 건드리지 않고 사람에게 간다.
  #   ★공급자 등급 게이트(`travel.delegation` 이 아니라 데이터 `supplier_bookings.tier`)와
  #   **둘 다** 통과해야 한다 — 등급은 「누구의 원장인가」, 여기는 「얼마까지 맡겼나」다.
  # ★★출처: **우리가 고른 값**이다. 측정에서 나오지 않았고 계약에서도 나오지 않았다
  #   (wiki 가 N·M·K 를 `[미확보]` 로 두고 있었다 — 값을 비워 두면 판정이 코드에 박히므로
  #   자리를 여기 만들고 고른 값을 적는다). 실제 업체 협약이 생기면 그 협약이 이 자리를 받는다.
  # ★「위임이 살아 있는가」는 여기 없다 — 데이터다(`delegations` 테이블, 마이그레이션 019).
  #   설정으로 두면 한 고객의 철회가 전원에게 적용되고, 철회 시각·주체가 남지 않는다.
  delegation:
    # M — 건당 상한. 50,000원. ★`bookings.amount_cents` 와 **같은 단위(전)** 로 둔다 —
    #   원 단위로 적어 두면 비교할 때마다 100 을 곱해야 하고 그 자리가 버그 자리가 된다.
    max_per_action_cents: 5000000
    # N — 여행(=고객) 전체 누적 상한. 150,000원. 같은 고객의 **성공한 자동 실행 금액 합**이다
    max_total_cents: 15000000
    # K — 같은 예약에 자동 실행을 몇 번까지. 2회. 3회째는 사람이 본다
    max_changes_per_booking: 2
    # 대상 종류 — `bookings.kind`. ★항공·숙박은 넣지 않는다(잠긴 예약, v11 §5)
    kinds:
      - activity
      - dining
    # 되돌림 조건 — 「무료 취소 구간 안에서만」. 출발 이만큼 앞까지가 그 구간이라고 본다.
    # ★구간을 벗어난 건은 자동 실행을 열지 않는다 — 되돌릴 수 없는 것을 사람 손 없이 하지 않는다
    free_cancellation_lead_hours: 72
    # 되돌림 기한 — 실행 시점부터 이만큼. 실제 기한은 이것과 무료 취소 구간 끝 중 **이른 쪽**이다
    revert_window_hours: 24
  weather:
    # ★★이 둘은 **판정 기준이 아니라 주의 문구 기준**이다.
    #   운영 규정(취소·순연 기준)은 `read.policy` 가 대야 하고, 그게 없으면
    #   Team 은 "규정 기준은 확인되지 않았다" 라고 말한다. 여기 숫자로
    #   「불가」를 만들지 않는다 — 근거 없는 확정이 되기 때문이다
    #   (CLAUDE.md §0.1).
    # ★출처: 정해진 것이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   여행 정책 코퍼스가 생기면 이 둘은 사라지고 규정이 그 자리를 받는다.
    advisory_precipitation_probability: 60   # %
    advisory_wind_speed_kmh: 40
  # ★`[2026-10-06]` 활동 판정 LLM(D-CS-008, `app/domains/travel_ops/instances/activity/judge/`).
  #   시간 제한은 `reliability.activity_judge_call_timeout_seconds` 에 있다.
  activity_judge:
    # 웹 근거의 게시일이 이보다 오래되면 버린다(임시휴무·행사 공지는 최근 것이어야 한다).
    # ★게시일이 **없는** 근거는 버리지 않는다 — 스파이크에서 3회 중 2회가 비었고, 버리면 거의 모두
    #   「모름」이 된다. 대신 차이 로그에 `undated` 로 센다(계획서 §7).
    # ★출처: **우리가 고른 값**이다. 측정하지 않았다.
    citation_max_age_days: 180
    # 섀도 판정을 백그라운드에서 동시에 몇 개까지 돌리나 · 밀린 것을 몇 개까지 받나.
    # ★넘치면 그 판정을 **건너뛰고** `shadow_skipped` 로 기록한다 — 고객 응답을 기다리게 하지 않는다.
    # ★출처: **우리가 고른 값**이다. 웹 검색 호출이 건당 약 $0.02~0.04(추정)라 몰림을 막는 상한이다.
    shadow_max_workers: 2
    shadow_max_pending: 16
    # 실시간 운영 상태(웹 검색)는 실외 활동이거나 시작까지 이 시간 안일 때만 본다. 그 밖은 부르지 않는다.
    # ★출처: **우리가 고른 값**이다(계획서 §6 4단계) — 임시휴무 공지는 대개 며칠 전에 나온다고 봤다. 측정 안 함.
    live_status_within_hours: 72
    # ★`[2026-10-14 사용자 지시]` 새벽 웹 확인 배치(`instances/activity/jobs.py` · 정기 작업 `activity_live_status`)를 돌리나.
    #   **관리 콘솔 「운영 설정」** 의 같은 이름 스위치로 켜고 끈다(콘솔 값이 먼저). 기본은 꺼짐 — 유료 웹 검색이라 운영자가 켤 때만 돈다.
    #   켜도 판정 모델(전역 `ACOP_ACTIVITY_JUDGE_MODE` · OpenAI 키)이 없으면 돌지 않는다. 읽는 곳: `settings_hook.activity_live_check_enabled(tenant)`.
    live_status_batch_enabled: false
    # ★`[2026-10-12]` 판정 종류별 섀도 켜기(구현 계획 1.4) — `rule`(LLM 안 부름) · `shadow`(백그라운드 비교만, 고객 답 그대로).
    #   전역 `ACOP_ACTIVITY_JUDGE_MODE=rule` 이면 이 표와 상관없이 전부 꺼진다(조립이 판정 LLM 을 넣지 않는다).
    #   `llm` = 규칙이 모를 때만 LLM, 조심하는 쪽 값만 받는다(D-CS-015 개정 2, 10-12). `off` 대신 `rule` 로 쓴다(YAML 이 off 를 false 로 읽는다).
    #   운영시간은 develop 판에 섀도 지점이 없어 `rule` 이다(D-CS-015 「② 운영시간은 붙이지 않는다」).
    # ★출처: 지금 동작 그대로가 기본값이다(10-12 전에는 전역 섀도면 아래 넷이 모두 돌았다).
    kind_modes:
      closure: shadow
      operating_hours: rule
      weather_sensitive: shadow
      disaster_effect: shadow
      # ★`[2026-10-12 사용자 결정]` DB 운영 정보로 규칙이 휴무 · 운영시간을 먼저 보고, 닫혔다고 못 정했을 때(연다 · 모름) 웹 검색으로
      #   그 날짜의 운영 · 폐업을 본다 — 「닫혔다」면 대체 장소를 붙여 바꾸자고 제안한다.
      #   전역 모드가 `rule` 이면 여전히 안 부른다(돈이 나가지 않는다). 켜려면 `ACOP_ACTIVITY_JUDGE_MODE=shadow`.
      # ★`[2026-10-13 코어 회신 9번]` **`shadow` 로 낮췄다**(위 10-12 `llm` 결정을 정확도가 재어질 때까지 미룬다). 이유:
      #   ① 정확도를 못 쟀다 — 실시간 운영은 라벨이 없다(`eval/activity_judge/build.py` · `judge/modes.py`).
      #   ② 고객 응답 앞에서 돌아 느리다 — 10-06 측정 p50 15.7초 · p95 40.7초, 24회 중 8회가 429(고객 대기 상한 30초).
      #   ③ `llm` 이면 「닫혔다」가 곧 대체 장소 변경 제안이 된다 — 맞는지 모르는 값으로 제안을 만들지 않는다.
      #   `shadow` 는 고객 답을 그대로 두고 값만 기록한다. 라벨로 정확도를 잰 뒤 `llm` 으로 올린다.
      # ★`[2026-10-13 사용자 결정 A안]` **웹 확인은 고객 요청마다 부르지 않는다** — 장소 · 날짜당 한 번 배치
      #   (`scripts/activity/check_live_status.py`)가 `live_status_within_hours` 안에 시작하는 활동만 확인해 `activity.ac_live_status`(304)
      #   에 저장하고, 고객 요청은 그 값을 읽기만 한다(`ActivityTeam.live_lookup` — 조립이 꽂는다). 비용은 요청 수가 아니라
      #   「그날 일정에 든 서로 다른 장소 수」에 비례하고, 응답에서 웹을 기다리지 않는다. 모드: `rule` 끔 · `shadow` 기록만 ·
      #   `llm` 저장된 「닫혔다」(인용 있는 것만)면 대체 장소를 붙여 변경 제안. 배치도 `rule` 이면 돌지 않는다.
      live_status: shadow
      # ★`[2026-10-12 사용자 결정]` 대체 후보 순서 — 코드가 찾고 검증한 후보 안에서 LLM 이 고객 취향에 맞춰 먼저 보여 줄 순서를 정한다
      #   (`instances/activity/alternative_order.py`). 기본은 끔 — 프롬프트 허용 목록 · 모델 인자(코어)가 붙은 뒤 shadow → llm 으로.
      # ★`[2026-10-13 코어 회신 11번]` **`shadow`** — 코어가 허용 목록(`ALLOWED_PROMPT_KEYS`)과 판정 어댑터 모델 인자(`judge(model=)`)를
      #   붙였다. 고객 순서는 코드 그대로, LLM 순서는 뒤에서 구해 로그에만 남긴다. 모델 선택(gpt-6-luna)은 섀도 기록이 쌓인 뒤 정한다.
      alternative_order: shadow
    # ★`[2026-10-12]` 판정 LLM 호출 상한(구현 계획 4.6) — 일 · 월. 넘으면 그 판정은 부르지 않고 `skipped`(budget_exhausted)로 남긴다.
    #   웹 검색(실시간 운영)은 따로 센다 — 호출당 약 $0.032(text 는 약 $0.0003, 10-06 측정 · 구현 계획 §1.2).
    #   text 2,000/일 ≈ $0.6 · 30,000/월 ≈ $9, web 50/일 ≈ $1.6 · 1,000/월 ≈ $32 (추정 상한).
    #   ★세는 곳은 DB(`external_call_budget` — `activity_judge` · `activity_judge_web` 줄)이고, 꽂는 것은 조립이다(코어 협의).
    #   조립이 꽂기 전에는 웹 검색만 활동이 프로세스 안에서 센다(`judge/modes.py` `LocalWebBudget`, 10-12) — 재기동하면 0 부터다.
    #   기본 모드가 `rule`(LLM 안 부름)이면 비용이 나가지 않는다.
    # ★출처: **우리가 고른 값**이다. 섀도 표본을 모으기에 넉넉하게, 비용 폭주는 막게.
    budget:
      text: {day: 2000, month: 30000}
      web: {day: 50, month: 1000}
    # ★`[2026-10-12]` 구현 계획 1.6 — 웹 검색이 성립 판정 **맨 앞**에서 고객 응답을 기다리게 하면서(실시간 운영 `llm`) 정한 값.
    #   측정(10-06 · 구현 계획 §1.2): 24회 중 8회 429, 동시 6이면 24/24 실패, p50 15.7초 · p95 40.7초.
    #   - web_max_concurrent: 프로세스 안에서 동시에 부르는 웹 검색 수. 넘치면 `web_wait_seconds` 만큼 자리를 기다리고, 못 잡으면
    #     부르지 않고 「모름」(`llm_busy`) — 아래 점검은 그대로 한다.
    #   - web_answer_timeout_seconds: 고객 응답을 기다리게 하는 상한. 넘으면 「모름」(`llm_timeout`). ★어댑터의 호출은 끝까지 돌 수 있다
    #     (스레드를 끊지 못한다) — 비용은 그대로 나가고 응답만 먼저 낸다. 어댑터 자체 상한은 `reliability.activity_judge_call_timeout_seconds`.
    #   - rate_limit_retries · rate_limit_backoff_seconds: 429 만 쉬었다 다시 부른다(SDK 재시도는 0 그대로 — 시간 초과는 다시 부르지 않는다).
    # ★출처: **우리가 고른 값**이다. 동시 2 는 측정(6 이면 전부 실패)에서 넉넉히 낮춘 값, 30초는 p50 의 두 배쯤 — 둘 다 다시 잴 것.
    # ★`[2026-10-12]` 대체 후보 순서 LLM 이 고객을 기다리게 하는 상한(원문 해석급 호출 — 측정 p95 3.1초). 넘으면 코드 순서. 우리가 고른 값.
    alternative_order_timeout_seconds: 8
    web_max_concurrent: 2
    web_wait_seconds: 5
    web_answer_timeout_seconds: 30
    rate_limit_retries: 1
    rate_limit_backoff_seconds: 2
  reminders:
    # ★일정 안내(v11 §6-B ②·③) 시각. `app/domains/travel_ops/components/watch/trip_reminders.py`.
    # ★출처: 정해진 기준이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    # ★`[2026-09-24 사용자 지시]` ③ 이동 알림은 **이동을 시작하는 그 시각**에 간다 — 앞에 붙이는 분이 없다.
    #   앞 판의 `departure_lead_minutes: 15` 를 지웠다. 이동 시간·여유는 일정의 이동 항목이 품는다
    #   (출발 = 다음 일정 시작 − 이동 시간 − 여유, D-020).
    day_start_lead_minutes: 60      # 그날 첫 항목 시작 몇 분 전에 하루 시작 안내
    # ★`[결정 2026-09-24]` 전날 안내를 **끈다.** 알림은 ① 하루 시작 ② 다음 일정 ③ 이동 — 새벽 3시에 전날까지의
    #   이슈를 모아 하루 시작 알림에서 한 번에 알린다(D-020). 전날 저녁 안내는 그 구성에 없다.
    eve_hour: null                  # 전날 몇 시에 다음 날 안내. 끄려면 null
  earthquake:
    # ★지진은 **사건**이라 일정 변경 사유(이상)가 될 수 있다. 다만 전국 어디 지진이든
    #   바꾸면 안 되니 거리·규모로 가른다. 반경 안 + 규모 이상 → 이상, 반경 안 + 규모
    #   미만 → 주의, 반경 밖 → 무시(국외 지진은 대개 여기서 걸러진다).
    # ★출처: 정해진 기준이 없어 **우리가 고른 값**이다. 측정에서 나오지 않았다.
    #   운영 규정(시설 점검·운영 중단 기준)이 생기면 그것으로 바꾼다.
    magnitude_min: 4.0          # 규모
    radius_km: 100              # 진앙 ~ 장소
    lookback_hours: 24          # 일정 시각(또는 지금) 전 몇 시간의 지진을 보나
  # -- 재난 시 일정 정지 · 피난 안내 (2026-10-06 사용자 결정 — `components/planning/safety.py` · `components/watch/safety_pause.py`) --
  # ★`[결정 2026-10-06 사용자]` ① 재난이 난 시각에 그 지역에 여행객이 있었다면 **그날 일정은 정지**한다. ② 전쟁 · 활화산 폭발처럼 **아주 심각한** 상황이면 **여행 일정 전체**를 정지하고
  # 근처 피난처로 자동 안내한다 — 안전을 위한 이동과 목적지를 알리는 안전 알림이 나간다. ③ 정지는 일정을 지우지 않는다(되돌리기 = 다시 시작).
  # ★아래 분류 값은 **우리가 고른 값**이다(측정 · 공식 코드표에서 나온 것이 아니다). `[미확인]` 행정안전부 재난문자의 재해구분명(`DST_SE_NM`)·긴급단계명(`EMRG_STEP_NM`) 전체 목록을
  # 못 구했다 — 받은 샘플은 호우·기타·교통통제·산사태 / 안전안내·긴급재난 뿐이다. 그래서 **재해구분이 모르는 값이어도 본문 낱말(`trip_keywords`)로 심각함을 가른다**.
  # 모르는 구분은 정지하지 않고 기존 안전 알림으로 남는다(조용히 정지시키지도, 조용히 넘기지도 않는다).
  safety:
    # false 면 정지를 하지 않는다(기존 동작: 대체 장소 교체 또는 안전 알림만)
    pause_enabled: true
    # ① 그날 정지 — 재난문자의 긴급단계가 이 중 하나여야 한다(안전안내 · 실종 · 교통통제 같은 일상 문자로는 정지하지 않는다)
    day_steps: ["긴급재난", "위급재난"]
    #   그리고 재해구분이 이 중 하나(몸이 위험한 것). 날씨 재해(호우 · 폭염 · 태풍 …)는 정지가 아니라 기존대로 실내 대체 · 안전 알림이다
    #   `[2026-10-13]` 「민방위」는 공식 재해구분 이름이 「민방공」이라 바꿨다(공식 목록 41종 — `ports/data_sources/disaster_msg.py` OFFICIAL_KINDS)
    day_kinds: ["지진", "지진해일", "화재", "산불", "붕괴", "폭발", "테러", "화산", "민방공", "원전", "방사능", "가스"]
    # ② 여행 전체 정지 — 아래 중 하나라도 걸리면: 긴급단계 · 재해구분 · 본문 낱말
    trip_steps: ["위급재난"]
    #   `[2026-10-13 사용자 승인]` 민방공은 이름만으로 여행 전체를 멈추지 않는다 — 대북 오물풍선 안내 같은 가벼운 문자도 민방공으로 온다. 공습경보 · 경계경보는 본문 낱말(trip_keywords)이 맡는다
    trip_kinds: ["화산", "테러", "원전", "방사능"]
    trip_keywords: ["공습경보", "경계경보", "화산", "분화", "전쟁", "미사일", "방사능", "생화학"]
    # 지진은 규모가 이 이상이면 여행 전체 정지(그 아래는 그날 정지). 반경 안 + 규모 하한은 `travel.earthquake` 가 먼저 가른다
    trip_magnitude_min: 6.0
    # 본문에 이 낱말이 있으면 **정지하지 않는다** — 훈련 문자 · 해제 문자
    # 「해제」는 여기서 뺐다 `[2026-10-12]` — 끝난 사건인지는 공용 판정(`ports/data_sources/notice_status.py`)이 가른다(「해제 예정」·「해제 시까지 대피」는 끝이 아니다)
    exclude_keywords: ["훈련", "실제 상황이 아"]
    # ★`[2026-10-11]` 활동 성립 판정의 재해 분류 — 유스케이스 수정본 §8(D2: 등급이 아니라 재해 성격). 활동 팀(`instances/activity/disaster_impact.py`)만 읽는다.
    #   재난 정지(위 day_kinds · trip_kinds)와 **한 곳**에 둔다 — 표가 둘로 갈라지면 성립 판정과 정지가 또 어긋난다(구현 계획 2.4).
    #   ★위 정지 기준은 바꾸지 않았다(더하기만). 정지 대상이면 이 분류와 상관없이 활동 판정도 막는다(`team._unclassified_safety_event`).
    #   `[미확인]` 재난문자 API 의 실제 재해구분명(`DST_SE_NM`) 전체 목록을 못 구했다 — §8 이름과 붙여 쓰기 · 다른 이름(민방공/민방위)을 함께 둔다.
    #   비교는 띄어쓰기를 지우고 한다. 셋 어디에도 없는 구분은 「분류되지 않음」 — 막지 않고 근거 · 경고로 남긴다.
    impact:
      # 지역 위험형 — 문자에 걸린 구의 모든 활동(실내 · 야외)을 막는다
      region_kinds: ["홍수", "호우", "태풍", "대설", "지진", "지진해일", "화산", "산사태", "화재", "산불", "교통통제", "교통사고",
                     "붕괴", "댐붕괴", "저수지사고", "정전", "가스", "폭발", "화학물질유출", "테러", "전쟁", "민방공", "민방위",
                     "국지도발", "미사일", "무인기", "맹수"]
      # 야외 위험형 — 야외 활동만 막는다(실내인지 모르면 계획 검증에서 고객에게 묻는다)
      outdoor_kinds: ["폭염", "한파", "강풍", "황사", "미세먼지", "낙뢰", "풍랑"]
      # 반영 안 함 — 막지 않는다(해제 문자는 공유 점검이 이미 뺀다)
      ignored_kinds: ["건조", "가축질병", "실종", "실종자", "도주", "도주자", "헌혈", "보이스피싱", "휴교", "기타"]
      # ★`[2026-10-11 사용자 결정]` 표 앞의 규칙 — 낱말은 띄어쓰기를 지우고 본문에서 찾는다(우리가 고른 값 · 실제 문자 표본으로 늘린다).
      # ① 상황이 끝났다는 말이 있으면 막지 않는다(「잠실동 일대 정전 복구가 완료되었습니다」). 위 exclude_keywords(훈련) · 공용 판정(`notice_status.py` — 해제)과 함께 본다
      release_keywords: ["복구가완료", "복구완료", "복구되었", "정상화되었", "통행재개", "운영재개", "통제를해제"]
      # ③ 장소 이름과 이 낱말이 함께 있으면 재해구분(「기타」 포함)과 상관없이 막는다 — 가도 못 본다(「경복궁 관람 전면 중단」)
      #   ② 통제 시간(「10/14 06:00~10/14 12:00」)은 본문에서 읽고, 방문 시각이 그 안일 때만 막는다(코드 `disaster_impact.control_window`)
      place_closure_keywords: ["중단", "휴관", "휴장", "폐쇄", "출입통제", "전면통제", "입장제한", "관람제한"]
    # 안내에 싣는 대피 장소
    shelters:
      max_listed: 3             # 몇 곳까지 알리나
      search_radius_km: 5       # 일정 위치에서 이 안에서 찾는다. 안에 없으면 「없다」고 알린다 — 먼 곳을 가까운 곳처럼 알리지 않는다
      walk_speed_kmh: 4.0       # 걷는 시간 추정(직선거리 기준) — 추정이라고 밝혀 알린다
    # 알림 본문에 싣는 재난문자 원문의 최대 글자 수(원문 그대로 · 잘리면 「…」)
    official_text_max_chars: 200
    # ★`[결정 2026-10-06 사용자]` 정지가 풀리지 않는 동안(재난이 해제돼도 사용자가 다시 시작하기 전까지) 관련 안내를 계속 보낸다.
    #   값은 **우리가 고른 값**이다(측정하지 않았다) — 6시간마다 최대 4번(처음 안내 뒤 24시간). 해제 전에는 처음 안내(공식 안내 · 가까운 대피 장소)를 다시, 해제 뒤에는 「아직 정지 중」을 보낸다.
    #   너무 잦다 · 모자라다는 말이 나오면 여기 값만 바꾼다. false 면 처음 안내와 해제 안내 한 번씩만 나간다.
    reminder:
      enabled: true
      interval_hours: 6
      max_count: 4
      # 멈춘 날의 **다음 날 아침**(KST) 이 시각 뒤 첫 점검에서 「아직 멈춰 있어요 — 이어갈까요?」를 **한 번** 묻는다. 저절로 재개하지 않는다(우리가 고른 값 — 측정하지 않았다).
      morning_ask_enabled: true
      morning_ask_hour: 9

# -- 웹 남용 방어 (2026-09-28 사용자 지시 · 계획 `wiki/records/plans/2026-09-28_2130_웹_남용방어_실행계획.md`) --
# 저장 `web_usage` · `runtime_limits`(마이그레이션 031). 코드 `app/domains/travel_ops/modules/web_account/web_guard.py`.
# ★여기 값은 **기본값**이다. 운영 API(`/admin/limits`)로 바꾼 값이 있으면 그것이 이긴다(범위 = `bounds`).
testing:
  # 사용자 요청: 현재 시험 배포에서는 단축 입력을 바로 제공한다. 관리자에서 끌 수 있다.
  intake_presets_enabled: true

web_guard:
  # ★`[사용자 결정 2026-09-28]` 개발 단계라 **꺼 둔다.** 꺼져 있어도 세기는 한다(운영 API 의 오늘 사용량 · 실제 비용 산정 재료).
  limits_enabled: false
  # ── 제안 기본값 산정 `[추정]` — 실제 호출 수를 재지 않았다. 재면 다시 계산한다 ──────────────────
  # 1) 아까운 것 = 공용 하루 한도. 돈은 지금 설정에서 거의 안 든다(모델은 로컬 Ollama, 유료 API 는 무료 한도 예산 027 안).
  #    관광공사 하루 1,000(`ACOP_RATE_TOUR_API_PER_DAY` — 미확인·보수적) · 카카오 하루 1,000(`travel.kakao_budget`) ·
  #    모델 시간 하루 86,400초(GPU 1대).
  # 2) 웹 몫 = 한도 × 0.5(나머지 반은 감시 루프·새벽 확인·카탈로그 동기화) × **안전 댐퍼 0.5** = 관광공사 250 · 카카오 250 · 모델 21,600초.
  # 3) 1회당 쓰는 양 `[추정 — 상한 쪽]`
  #      계획 읽기  관광공사 15(장소 5 × 좁혀 찾기 최대 3) · 카카오 5 · 모델 50초(사진 한 장 ~45초 + 가리키기)
  #      일정 짜기  관광공사 30(고른 장소 15 × 영업시간 찾기+읽기 2) · 모델 20초
  #      확인       외부 호출 0(다시 조립·판정) — 계획 읽기 한 번에 한 번이라 서비스 상한은 계획 읽기와 같게
  #      여행 만들기 관광공사 15 · 채팅 관광공사 1(주소·운영시간 질문, 6시간 캐시) · 모델 3초
  # 4) 웹 몫을 작업에 나눈다 — 계획 읽기 30% · 일정 짜기 40% · 여행 만들기 10% · 채팅 20%.
  #    서비스/일 = min(소스별 몫 ÷ 1회당) → 계획 읽기 5 · 일정 짜기 3 · 확인 5 · 여행 만들기 1 · 채팅 50.
  # 5) 키당/일 = min(보통 필요 × 2, 서비스) — 보통 필요: 계획 읽기 2 · 일정 짜기 2 · 확인 2 · 여행 만들기 1 · 채팅 30.
  #    주소당/일 = min(키당 × 3(한 집·행사장), 서비스).
  # ★병목은 관광공사 하루 한도다. 운영 계정으로 한도를 올리면(예: 10배) 서비스 상한도 같은 비율로 올린다.
  limits:
    intake:      {per_key_day: 4,  per_ip_day: 5,  service_day: 5}
    plan:        {per_key_day: 3,  per_ip_day: 3,  service_day: 3}
    confirm:     {per_key_day: 4,  per_ip_day: 5,  service_day: 5}
    trip_create: {per_key_day: 1,  per_ip_day: 1,  service_day: 1}
    message:     {per_key_day: 50, per_ip_day: 50, service_day: 50}
    # 모델 예열(2026-09-29) — 실제로 모델을 부를 때만 센다(이미 올라가 있거나 `warmup.dedupe_seconds` 안이면 안 센다).
    #   관광공사·카카오를 안 쓰고 한 토큰 생성이라 위 산정과 다르다. 출처: **우리가 고른 값** — 화면을 하루 30번 연다고 보고
    #   키당 30 · 주소당 ×3 · 서비스는 하루 1,440분 ÷ 예열 간격 1분 = 1,440 이하로 500
    warmup:      {per_key_day: 30, per_ip_day: 90, service_day: 500}
    # 장소 검색 · 대체 후보 · 사진(2026-10-02, 확인 화면 수정 화면) — 카카오 키워드 검색(하루 1,000건을 접수 읽기와 나눠 쓴다)과 관광공사 사진 조회를 부른다.
    #   출처: **우리가 고른 값**(2026-09-30 「지도에서 장소 고르기」 계획의 기본값 그대로) — 카카오 몫 절반(500)을 서비스 상한으로 두어 접수 읽기 몫을 남기고,
    #   키당 60(수정 화면을 몇 번 열어도 넉넉) · 주소당 200(한 집·행사장)
    place_search: {per_key_day: 60, per_ip_day: 200, service_day: 500}
    # 개인 AI 입구(MCP)의 읽기 도구(2026-10-06). 출처: **우리가 고른 값**(측정 안 함).
    #   risk_check — 「새로 확인(fresh)」만 센다(캐시만 읽는 기본 호출은 아래 risk_read 로 따로 센다). 한 번에 최대 3항목 × 소스 몇 개를 부를 수 있어 하루 몫이 작다: 키당 10 · 주소당 30 · 서비스 40
    #   move_judge — 이 서버의 시간표 · 도로 그래프와 자체 길찾기 서버(GraphHopper)만 쓴다(바깥 유료 소스 없음). 계산 부하만 막는다: 키당 200 · 주소당 600 · 서비스 2000
    risk_check:  {per_key_day: 10, per_ip_day: 30, service_day: 40}
    #   risk_read — 캐시만 읽는 기본 호출(바깥에 안 나가고 하루 한도를 안 쓰지만 서버 DB 조회 · 스레드는 쓴다 — 코덱스 검토 [중간]). 3분마다 한 여행을 계속 읽어도 하루 480번: 키당 600 · 주소당 1800 · 서비스 20000
    risk_read:   {per_key_day: 600, per_ip_day: 1800, service_day: 20000}
    move_judge:  {per_key_day: 200, per_ip_day: 600, service_day: 2000}
  bounds:
    count: {min: 1, max: 100000}          # 횟수 한도가 받는 범위(0 으로 끄지 않는다 — 끄는 것은 limits_enabled)
    session_per_ip_hour: {min: 1, max: 1000}
    session_hours: {min: 1, max: 8760}    # 세션 수명 · 게스트 보존 시간(시간 단위) — 1시간 ~ 1년
  cache_seconds: 30                       # 운영이 바꾼 값을 프로세스가 이만큼 캐시 — 반영이 이만큼 늦을 수 있다
  # 화면 안 지도 종류(`[사용자 결정 2026-09-29]`) — 운영 설정 `web.map_provider` 로 바꾼다. 기본 무료 지도(OSM, 개발·시연용 —
  #   타일 정책상 많이 쓰면 막힐 수 있다). google 이면 `POST /v1/web/map-load` 가 구글 지도 예산을 확보한다
  map_provider:
    default: osm
    choices: [osm, google]
  # ── 브라우저 세션(쿠키) · 게스트 보존 — `[결정 2026-10-04 사용자]` D-CS-011 ─────────────────────────────
  # ★출처: 게스트 보존은 **재방문 간격 공식**으로 구한 초기값이다(`wiki/decisions/D-CS-011-browser-session-cookie.md` §2) —
  #   `T* = t0·[(α−1)/(ρ·t0)]^(1/α)`, t0=30분 · α=1.2(뉴스 포털 방문 간격, 여행 게스트 실측 아님) · ρ=1%/일(정책값, 근거 없음) → 6.4일 → 7일.
  #   24시간은 재방문의 54% 만 살린다(계산). **여행 게스트의 실제 재방문 간격을 못 찾았다 — 초기값일 뿐이고 관리 콘솔에서 조절한다.**
  guest_idle_hours: 168             # 로그인 안 한 사용자 — 마지막 사용 뒤 이만큼 지나면 세션이 끝나고 데이터가 지워진다
  member_idle_hours: 168            # 소셜 계정을 붙인 사용자의 세션 — 마지막 사용 뒤 이만큼. `[추정]` 구글로 한 번에 다시 로그인된다
  session_max_hours: 720            # 모든 세션의 절대 수명(만든 뒤) — 30일. 쿠키 `Max-Age` 도 이 값
  session_touch_seconds: 60         # 마지막 사용 시각을 이보다 잦게 쓰지 않는다(요청마다 쓰기를 막는다)
  guest_cleanup_enabled: true       # 게스트 정리(만료된 게스트의 여행 · 접수 · 세션 · 키 · 사용자 삭제)
  # 게스트(웹으로 만든 사용자 중 소셜 계정이 안 붙은 사용자)의 제한 — 출처: **우리가 고른 값**(사용자 「나머지는 니 제한대로」)
  guest:
    max_trips: 1                    # 여행 개수 — 사용자 행 잠금으로 동시 생성까지 막는다
    trip_start_max_days: 365        # 여행 시작일 상한(오늘부터)
    trip_length_max_days: 7         # 여행 길이 상한(일) — 기준 상품(서울 · 최대 7일 · 4인)
    trip_grace_days: 3              # 일정이 남은 게스트는 **마지막 일정 종료 뒤 이만큼**까지 지우지 않는다(계획서 링크 · 알림이 그때까지 산다)
    trip_keep_max_days: 180         # 단 마지막 사용 + 이만큼이 상한 — 날짜를 빌미로 영구 보존하지 않는다(상한은 지금이 아니라 마지막 사용 기준)
  ip_retention_hours: 48                  # 주소 해시 줄을 이만큼 뒤 지운다(개인정보 — 제한용으로만 짧게)
  usage_retention_days: 35                # 키·서비스 사용량 줄(비용 산정 재료)
  warmup:
    # 이 초 안에 이미 예열을 시작했으면 다시 부르지 않는다(프로세스 안). 출처: 우리가 고른 값 — 한 토큰 예열이
    #   식은 모델에서 35초 안팎(ui 세션 실측 35~37초)이라 그보다 길게
    dedupe_seconds: 60
  turnstile:
    # Cloudflare 문서 `[확인 2026-09-28]` developers.cloudflare.com/turnstile/get-started/server-side-validation
    verify_url: "https://challenges.cloudflare.com/turnstile/v0/siteverify"
    timeout_seconds: 5
    max_token_chars: 2048                 # 문서: 토큰 최대 2,048자 · 5분 유효 · 한 번만 확인

# -- 약관 동의 기록 · 사용 조건 (2026-10-05 사용자 지시 — ui 세션 요청서, `travel_ops/modules/web_account/consents.py`) --
consent:
  terms_version: "2026-10-10.1"    # 약관 버전 — 올리면 모두 다시 동의해야 한다. 정본 약관 전문은 웹 번들과 같은 버전(`TERMS_VERSION`)
  required: [service_terms, privacy]   # 이 코드가 지금 버전으로 동의돼 있어야 앱을 쓴다. 선택 항목(sensitive · location · alert_channel)은 앱을 막지 않는다(법무 확인 전)
  gate_enabled: false              # ★기본 꺼짐 — 웹이 동의 화면을 내보낸 뒤에 켠다. 켜면 동의 없는 호출은 403 consent_required (게스트 · 회원 · 에이전트 키 모두)
  evidence_retention_days: 1825    # 동의 기록(증빙) 보관 일수 — 5년. 출처: ui 세션 추천(분쟁 대비 일반 관행 — 법무 확인 전). 지나면 정리 작업이 지운다

# -- 약관의 보관 기간 · 파기 (2026-10-07 사용자 결정 — uiux 전달, `components/customer/retention.py` · `modules/web_account/member_cleanup.py`) --
# ★이 값들이 약관 화면의 문장(「마지막 이용 후 1년이 지나면 파기」)이 된다. 출처: **ui 세션 추천값을 사용자가 2026-10-07 확정**(변호사 검토는 아님).
#   관리 화면에서 바꾸면(`/admin/retention` — 누가 · 언제 · 왜 남김) 약관 버전이 `+ret{N}` 으로 따라 올라 모두 다시 동의한다.
# ★동의 기록 보관 일수(`consent_days`)의 기본값은 위 `consent.evidence_retention_days` 다(두 곳에 적지 않는다).
retention:
  member_idle_days: 365                 # 회원 여행 · 대화 기록 — 마지막 이용 뒤 이만큼 지나면 파기(회원이 지우거나 탈퇴를 요청하면 그전에도 지운다)
  location_points_days_after_trip: 7    # 위치 점 — 여행 종료 뒤. ★서버에 위치 저장 기능이 아직 없어 지울 대상이 없다(값만 약관에 쓴다)
  location_proof_months: 6              # 위치 확인자료 — 기록한 때부터(고시 최소 기간). 위와 같이 지울 대상은 위치 기능이 생길 때 붙는다
  case_follows_trip: true               # 처리 기록(Case) — 여행 · 게스트 자료가 지워질 때 함께 지운다. false 면 옛 동작(닫기만)
  # 정리 작업 모드 — off(아무것도 안 함) · dry_run(건수만 세어 `retention_runs` 에 남김, 아무것도 안 지움) · on(지움).
  # ★지우는 일은 되돌릴 수 없다 — 기본은 dry_run 이고, on 은 사용자가 건수를 보고 승인한 뒤에 관리 화면(`/admin/limits` 의 `retention.purge_mode`)에서 켠다
  purge_mode: dry_run
  purge_batch: 100                      # 한 번에 처리하는 회원 수 상한(오래 안 잡는다)
  bounds:                               # 관리 화면이 넣을 수 있는 값의 범위
    member_idle_days: {min: 30, max: 3650}
    consent_days: {min: 365, max: 3650}
    location_points_days_after_trip: {min: 1, max: 365}
    location_proof_months: {min: 1, max: 60}

# ── 이동 계산기(app/domains/travel_ops/instances/mobility/engine) 정책 수치 ──────────────────────
# ★`[2026-09-29 이동 계산기 문제목록 #49]` 엔진 규칙 JSON(rules_v0.3.json)에 따로 있던 값을 여기로 옮겼다 — 그 JSON 에는
#   `value_from: guardrails:mobility.…` 표시만 남는다. 값은 옮기기 전과 같다(이동 담당 판정 규칙 v0.9.1).
# ★출처: 이동 담당이 고른 값(grade 추정) — 근거 문장은 규칙 JSON 의 같은 칸에 남아 있다. 합성 여행 20~30건으로 조정 예정.
mobility:
  departure_observation:
    # 잠정 운영 정책. GTFS 권장을 참고한 자료 나이 상한이며 서울 API SLA·예측 정확도 보장이 아니다.
    max_provider_age_seconds: 90
    # 공급·소비 시계의 작은 어긋남 허용. 실제 공급 나이와 함께 근거로 보존한다.
    max_provider_clock_ahead_seconds: 2
  buffer:
    by_stage:                     # 지연 흡수 여유(분) — 소요가 아니라 「성립」과 「안전하게 성립」의 차이
      planning: 10
      pre_departure: 10
      in_progress: 15             # 진행 중에는 되돌릴 시간이 없어 더 보수적으로
  limits:
    transfers:                    # 환승 상한(회) — 성립해도 이 일행에게 무리면 탈락
      default: 2
      infant: 1
      fatigue_high: 1
      elderly: 1
    walk_m:                       # 도보 상한(m, 직선) — 1.04 m/s 기준 약 19분
      default: 1200
      infant_or_luggage: 800
  staleness:
    timetable_warn_days: 30       # 시간표가 이보다 오래되면 경고(판정 불가가 아니라 재수집 신호)
    walk_speed_recheck_days: 90   # 보행 속도 가정을 다시 잴 주기

# 서비스 개선 합성 자료. 약관 문장을 바꿀 때 consent.terms_version도 올린다.
service_improvement:
  max_generations: 4            # tenant 전체 누적, 실패/철회/만료에도 환불·초기화 없음
  candidate_days: 7
  approved_days: 1825
  review_days: 365
  synthetic_rows: 500
  noisy_min_count: 50           # 익명성 보장 기준 아님; 잡음 처리된 자료량 기준
