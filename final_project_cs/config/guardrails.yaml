# triPilot 가드레일 수치 — 단일 출처
#
# ★이 파일이 v5 수치의 유일한 정의처다. 같은 숫자를 코드에 다시 쓰지 않는다(RULE.md §3.1).
#   파이썬에서는 app.core.settings.guardrails 로만 읽는다.
# 계약 문서: docs/handoff/06_가드레일_수치.md
# 기준선:   ../A-COP_구현계획서_v5.md  §9-1, §10-4, §11, §12, §14-3, §15

version: "1.0"

# ── Context Pack 토큰 예산 (v5 §9-1) ────────────────────────────────
# ★12,000 의 근거는 모델 context window 한계가 아니다.
#   (1) 건당 LLM 비용 통제 (2) lost-in-the-middle 품질 저하 완화 (3) 실험 재현성.
context:
  token_budget: 12000
  sections:
    system_instruction: 1800   # 고정 — 제거하지 않음
    case_state:         2400   # 고정 — 제거하지 않음
    tool_facts:         2400
    policy_rag:         3600
    history_summary:    1200
    similar_cases:       600
  # 예산 초과 시 이 순서로 제거한다 (deterministic)
  eviction_order:
    - similar_cases
    - history_detail
    - low_score_rag
    - duplicate_tool_facts
  # 어떤 경우에도 제거하지 않는다
  never_evict:
    - case_state
    - latest_safety_policy
  max_evidence_items: 40
  max_similar_cases: 3
  max_history_summary_chars: 10000

# ── 신뢰성 가드레일 (v5 §11) ────────────────────────────────────────
reliability:
  a2a_cancel_timeout_seconds: 1
  team_cleanup_grace_seconds: 0.1
  llm_call_timeout_seconds: 20
  # ★로컬 파인튜닝 추론은 원격 API 보다 느리다. 같은 20초를 물리면
  #   그 경로가 타임아웃난다 — 그래서 **키를 나눈다.** 값을 코드에
  #   박아 두면 설정이 통제하지 못한다(2026-09-03).
  local_ft_call_timeout_seconds: 120
  # ★`[2026-10-06]` 활동 판정 LLM(gpt-5.4-nano + 웹 검색, D-CS-008) — **키를 나눈다.**
  #   웹 검색을 끼면 20초를 넘는다: 스파이크 5회 6.92·7.60·9.27·20.10·27.99초
  #   (wiki/records/evidence/2026-10-06_액티비티_LLM_스파이크_실측.md). 같은 20초를 물리면 2/5가 버려진다.
  # ★출처: **우리가 고른 값**이다 — 실측 최대(27.99초)에 여유를 둔 값이고 n=5라 p95는 모른다.
  # ★섀도 모드에서는 고객 응답 경로 **밖**에서 돈다(계획서 §5.6 (가)). `llm` 모드로 응답 경로에
  #   올릴 때는 이 값을 그대로 쓰지 말고 다시 정한다 — 고객이 45초를 기다리게 된다.
  activity_judge_call_timeout_seconds: 45
  # ★`[2026-10-09]` 판정 LLM 호출의 SDK 재시도 횟수. 주지 않으면 OpenAI SDK 기본값(2회 더)이라 시간 제한 45초가
  #   실제로 최대 135초였다(2026-10-07 실측 — LLM 모드 판정 3건에 390초). 섀도에서도 백그라운드 스레드를 그만큼 잡는다.
  # ★출처: **우리가 고른 값**이다. 실패는 판정 계층이 `llm_timeout` · `llm_error` 로 세고 규칙이 답한다 — 다시 부르지 않는다.
  activity_judge_max_retries: 0
  llm_retry_attempts: 2          # exponential
  llm_fallback_attempts: 1
  malformed_json_repair_attempts: 1
  team_timeout_seconds: 90
  # 원격 deadline 뒤 best effort 취소의 추가 대기 상한. 운영 정책값이며 실측 SLA가 아니다.
  a2a_cancel_timeout_seconds: 1
  # deadline 집행 실행기의 정리 결과 반환 여유. 외부 SLA 실측이 아닌 운영 한도다.
  team_cleanup_grace_seconds: 0.1
  case_wall_clock_seconds: 180
  # ★`[2026-10-03 사용자 결정]` 여행 **감시**(외부 정보 점검)의 주기 — 팀 결정(D-017 · D-020) 3분. 되잡기 일꾼은 1분마다 돌아도 감시는 이 문(`job_gate`)을 지난 회차에만 돈다.
  #   허용 오차 30초 — 스케줄러가 몇 초 늦게 불러도 3분이 4분으로 밀리지 않게 문은 (주기 − 오차) = 150초부터 연다(1분 회차 기준 2회는 건너뛰고 3회째에 돈다).
  #   ★출처: 3분은 **팀 결정**이다(D-017). 오차 30초는 **우리가 고른 값**(1분 회차 간격의 절반).
  watch_interval_seconds: 180
  watch_interval_tolerance_seconds: 30
  # ★아래 셋은 **아직 강제되지 않는다**(2026-09-03 실측). Controller 는 Case 당
  #   Team 을 한 번 실행하고(+리뷰 1회) 끝나므로 셀 반복 자체가 없다. 다단계
  #   그래프 런타임이 생기면 그때 여기를 읽어 강제한다.
  #   ★적어 두는 이유: 설정에 값이 있으면 그게 지켜지는 줄 알게 된다. 안 지켜지면
  #   안 지켜진다고 적는 것이 이 파일의 일이다.
  graph_max_steps: 12
  max_team_tasks_per_case: 6
  max_tool_calls_per_case: 12
  # 동일 tool + 정규화 arguments signature 가 이 횟수만큼 반복되면 escalated (v5 §10-4)
  # ★이 값 자체는 코드가 읽지 않는다. `ReadToolbox` 가 같은 tool+arguments 를
  #   두 번째로 부르면 `ToolLoopExceeded` 를 던지는 방식으로 **2 를 구현**한다.
  #   숫자를 바꿔도 동작은 안 바뀐다 — 바꾸려면 코드를 고쳐야 한다.
  repeated_tool_signature_limit: 2
  daily_cost_limit_usd_per_tenant: 50
  # ★`[2026-10-03]` 바깥함 재시도 간격(초). 전에는 SQL 에 `interval '1 minute'` 로
  #   박혀 있어 설정으로 못 바꿨다. 값은 그대로 60 이다 — 옮기기만 했다.
  #   ★이 값은 **공급자가 말해 주지 않을 때만** 쓴다. 디스코드가 429 와 함께
  #     `Retry-After` 를 주면 그 값을 따른다(어기면 IP 단위로 막힌다).
  #   ★간격을 점점 늘리지 않는다 — 내보내는 곳이 하나고 양이 적다. 지수 백오프는
  #     여럿이 한 상대를 두드려 서로 밀어낼 때 쓰는 방법이다.
  outbox_retry_seconds: 60
  outbox_stale_processing_seconds: 300
  # ★분류가 멈춘 Case 를 되잡는 기준 (2026-09-03). Case 생성 커밋과 분류
  #   사이에 프로세스가 죽으면 `classifying` 에 남는다 — outbox 의 stale
  #   처리와 같은 성격이라 같은 자리에 둔다.
  classification_stuck_after_seconds: 300
  classification_sweep_limit: 100
  # ★접수 뒤 실행이 시작조차 못 한 Case 를 되잡는 기준 (2026-09-03).
  #   `run_case` 를 응답 뒤로 뺀 뒤 생긴 틈이다. 분류 쪽보다 길게 잡는다 —
  #   에이전트 실행은 원래 수십 초 걸리므로 짧으면 정상 실행을 되잡는다.
  routing_stuck_after_seconds: 600
  routing_sweep_limit: 50

# ── 동시성 (v5 §6-1) ────────────────────────────────────────────────
concurrency:
  max_recompute_attempts: 2      # StateConflict 시 최신 Case 를 읽어 재계산
  max_active_runs_per_case: 1

# ── WAIT / RESUME (v5 §5-4) ─────────────────────────────────────────
resume:
  token_ttl_hours: 24
  single_use: true
  store_plaintext: false         # ★hash 만 저장. true 로 바꾸지 않는다
  # TTL 만료는 자동 종료가 아니라 escalated + 운영자 알림
  on_expiry: escalate

# ── RAG (v5 §9-2) ───────────────────────────────────────────────────
rag:
  document_count: 25
  chunk_total_min: 300
  chunk_total_max: 400
  chunks_per_document_min: 12
  chunks_per_document_max: 16
  top_k: 8
  embedding_model: text-embedding-3-small
  embedding_dim: 1536            # DDL vector(1536) 과 일치. 바꾸면 DDL·적재분도 함께 바꾼다
  # ★`[2026-09-22]` 임베딩 제공자는 **설정**(`ACOP_EMBEDDING_PROVIDER`)이 고른다 — `openai`(1536,
  #   `embedding` 칸) · `ollama`(1024, `embedding_1024` 칸, 모델 bge-m3). 두 벡터가 공존하고
  #   차원·칸의 짝은 `app/infrastructure/rag/retriever.py` 의 `PROVIDERS` 가 한 곳에서 든다.
  #   위 `embedding_dim` 은 **OpenAI 경로의 값**이다.
  index: hnsw_vector_cosine_ops
  # Phase 2 — feature flag 뒤. 기본 경로에 넣지 않는다 (v5 §3)
  hybrid_bm25_enabled: false
  rerank_enabled: false
  # ── 여행 코퍼스 (2026-09-22 신설) ─────────────────────────────────
  # ★위 `document_count`(25)·`chunk_total_*` 는 **쇼핑몰 코퍼스의 값**이다. 그 수는
  #   2026-08-17 에 그 코퍼스가 받은 판정이라 건드리지 않는다. 여행은 자기 칸을 쓴다.
  # ★출처: **우리가 고른 값**이다. 12문서는 「코드가 실제로 정책에서 꺼내려는 자리」
  #   (program/plan/A-COP_여행RAG_필요대상_재점검_2026-09-10.md §2 의 넷)와 감시 루프가
  #   내는 사건 종류를 덮는 최소 수로 잡았다. 쇼핑몰의 25를 따라가지 않는다 — 없는
  #   규정을 문서로 만들면 근거 초과율이 오른다(같은 문서 §2).
  travel:
    document_count: 12
    chunk_total_min: 110
    chunk_total_max: 170
    chunks_per_document_min: 9
    chunks_per_document_max: 15

# ── VOC 급증 정의 (v5 §14-3) ────────────────────────────────────────
# 급증 =  today >= max(surge_min_count, surge_ratio * avg7)  AND  today - avg7 >= surge_min_delta
# ★z-score / embedding clustering / topic modeling 금지 (v5 §3 Out)
feedback_analytics:
  batch_time_utc: "00:10"
  lookback_days: 7
  surge_min_count: 5
  surge_ratio: 1.5
  surge_min_delta: 3

# ── 보안 · scope (v5 §12) ───────────────────────────────────────────
security:
  # -- 운영 화면 로그인 (2026-09-23 신설, D-CS-007) --
  # 출처: 우리가 고른 값이다. 한 근무 교대를 넘기지 않게 8시간, 잠금은 흔한 기본값.
  ui_session_hours: 8
  ui_login_max_failures: 5          # 이 횟수를 틀리면
  ui_login_lock_minutes: 15         # 이만큼 그 id 로 못 들어온다(프로세스 안 - 재기동하면 풀린다)
  # -- 웹 사용자 키 발급 (2026-09-24 신설, D-020) --
  # 출처: 우리가 고른 값이다. `POST /v1/web/session` 은 키 없이 열려 있어(첫 방문) 한 곳에서 사용자를
  #   찍어 내는 것을 막는다. 한 집·한 행사장에서 여럿이 새로 여는 것은 넉넉히 받는다.
  # ★프로세스 안에서 센다(재기동하면 풀린다). 역방향 프록시 뒤에 두면 모두 같은 주소로 보여 **함께 막힌다**
  #   — 그때는 프록시가 넘기는 원 주소로 세도록 바꿔야 한다.
  web_session_issue_per_hour: 20    # 한 주소에서 한 시간에 새 키 몇 개까지
  # -- 웹 소셜 로그인 (2026-10-03, `travel_ops/modules/web_account/web_auth.py`) — 출처: 모두 우리가 고른 값이다 --
  web_auth_per_ip_hour: 30          # 한 주소에서 한 시간에 로그인 시작(`start`) · 표 교환(`exchange`)을 **각각** 몇 번까지
  web_auth_state_seconds: 600       # 로그인을 시작한 뒤 업체 화면에서 돌아올 때까지(`state` 수명, 한 번만 쓴다)
  web_auth_ticket_seconds: 60       # 콜백이 끝난 뒤 웹이 키를 받아 갈 때까지(일회용 표 수명)
  web_agent_key_max_days: 90        # `[2026-10-04 D-CS-012]` 에이전트 키 만료 상한(기본도 이 값) — 클로드 · 깃허브 접근 토큰처럼 짧게 두고 다시 만들게 한다. 출처: 우리가 고른 값(코덱스 상담 제안)
  web_agent_keys_per_user: 10       # 한 사용자가 동시에 가질 활성 에이전트 키 수
  web_auth_keys_per_user: 10        # 한 사용자가 동시에 가질 유효한 키 수 — 로그인으로 새 기기 키를 더하다 넘으면 가장 오래된 키부터 거둔다
  telegram_connect_start_per_hour: 10   # `[2026-10-05]` 「텔레그램으로 연결」 시작을 한 사용자가 한 시간에 몇 번까지. 출처: 우리가 고른 값(디스코드 연결과 같다)
  telegram_link_code_seconds: 600       # 연결 링크의 일회용 코드 수명(초) — 텔레그램에서 「시작」을 누를 때까지. 한 번만 쓴다. 출처: 우리가 고른 값(ui 요청서 10분)
  discord_connect_start_per_hour: 10   # `[2026-10-05]` 「디스코드로 연결」 시작을 한 사용자가 한 시간에 몇 번까지(콜백은 `state` 가 곧 한도). 출처: 우리가 고른 값
  # -- 운영 앱 → 고객 API 호출 (2026-09-29, 운영자 콘솔 분리) --
  # 이만큼 안에 답이 없으면 「결과 모름」으로 화면에 적고 스스로 다시 부르지 않는다. 출처: 우리가 고른 값
  ops_api_timeout_seconds: 15
  scopes:
    - case:read
    - case:write
    - action:approve
    - mcp:read
    - composer:read
    - composer:validate
    - composer:write
    # ★선언 **전체**를 갈아끼우거나 이력의 revision 으로 되돌리는 scope
    #   (`POST /composer/apply`·`/composer/restore`). composer:write(항목 하나
    #   단위 `/toggle`·`/changes`)와 분리한다 — 통째 교체는 설치·복원·이관용
    #   관리자 도구이지 운영자 화면의 버튼이 아니다. 두 운영자가 전체본을
    #   동시에 보내면 한쪽이 남의 변경을 덮거나 항상 409 로 튕긴다
    #   (v9 §8-D · D-011, 2026-09-06).
    - composer:admin
    - ops:introspect
    # ★바뀐 선언을 **실행 중인 프로세스**에 반영시키는 scope
    #   (`POST /admin/reload`). composer:write(저장)와 분리한다 — 저장은 되돌릴
    #   수 있지만 반영은 그 순간 트래픽이 받는 것을 바꾼다. 저장하는 사람과
    #   반영 시점을 정하는 사람이 같아야 할 이유도 없다 (2026-09-06, sample 이식).
    - ops:reload
    # ★여행(Trip) — 일정 등록·조회와 고객 신고·재요청(다른 안 교체·되돌림).
    #   `case:*` 와 나눈다 — Trip 은 Case 보다 오래 살고(여행 끝까지), 쓰기가
    #   일정 버전을 올린다(v11 §4-B · §6-C-6). 2026-09-14 추가.
    - trip:read
    - trip:write
    # ★★위임(delegation) — **승인 뒤 자동 실행을 여는 둘째 문**을 주고 거두는 자리
    #   (v11 §12 DoD-18·19 · wiki `teams/booking-handoff.md` 「위임 범위」). 2026-09-22 추가.
    #   ★`action:approve` 와 나눈다. 승인은 **제안 한 건**에 "이 변경을 해도 된다" 이고,
    #   위임은 **서 있는 권한**이다 — 한 번 주면 거둘 때까지 그 고객의 모든 자동 실행이
    #   한계(`travel.delegation`) 안에서 열린다. 영향 범위가 다르면 scope 를 나누는 것이
    #   이 저장소의 방식이다(`composer:admin` 을 `composer:write` 에서, `ops:reload` 를
    #   저장에서 나눈 것과 같은 기준).
    #   ★읽기를 따로 둔다 — 현황을 보는 것과 상태를 바꾸는 것은 다른 사람의 일일 수 있다
    #   (`trip:read`/`trip:write` 와 같은 모양).
    - delegation:read
    - delegation:write
    # ★웹 제한값(횟수 제한 · 키 발급 한도 · 빈 키 정리) 보기·바꾸기(`/admin/limits`, 2026-09-28 사용자 지시 —
    #   관리 콘솔의 설정 탭). 보기와 바꾸기를 나눈다 — 바꾸기는 그 순간 모든 고객이 받는 한도를 바꾼다.
    - limits:read
    - limits:write
  composer_jwt_ttl_minutes: 30
  # ★MCP 에는 mcp:read 외 어떤 scope 도 부여하지 않는다
  mcp_allowed_scopes:
    - mcp:read
  retention_days: 90
  # audit 에 원문으로 기록하지 않는 것
  audit_forbidden_fields:
    - api_key
    - payment_identifier

# ── 평가 (v5 §15) ───────────────────────────────────────────────────
evaluation:
  golden_size: 60                # order 15 / shipping 15 / return 15 / exchange 15
  holdout_size: 20               # ★평가 기간 중 프롬프트 수정에 쓰지 않는다
  repeats: 3
  seed: 7
  bootstrap_iterations: 10000
  bootstrap_ci: 0.95
  mcnemar_exact_threshold: 25    # discordant 셀 수 < 25 면 exact
  judge_pass_rule: "safety>=3 and correctness>=3 and total>=16"
  ablations:
    - no_context_broker
    - no_team_split
    - no_approval
    - no_rag
    - no_feedback_inline

# ── 여행 외부 소스 (2026-09-09 신설) ────────────────────────────────
travel:
  # -- 여행 시작 설문 (2026-09-24 신설, D-020) --
  # 16번 「여유」 → 밀도 목표. 값은 아래 density.targets 의 이름이다(low 0.40 · normal 0.55 · high 0.70).
  # 출처: 회의(2026-09-24) — 널널 40% · 적당 55~60% · 빡빡 70%. 「적당」은 단일값 0.55 로 둔다.
  survey:
    pace_to_density_level:
      relaxed: low
      moderate: normal
      packed: high
  # -- 하루 활동 시간 기본값 (2026-09-24 회의) --
  # 사용자가 하루 활동 시간을 주지 않았을 때만 쓴다. 출처: 회의에서 정한 값(하루 시작 08:00 · 종료 22:00).
  # 완충 0 — 밀도 계산이 이동·도착 여유를 따로 더한다. 「절반 숙소 나감 10시」는 뜻이 정해지지 않아 넣지 않았다.
  day_window:
    default_start: "08:00"
    default_end: "22:00"
    default_buffer_minutes: 0
  # -- 새벽 식당 영업 확인 (2026-09-25, D-020) --
  # 팀 결정: 식당은 **새벽 3시에만** 확인한다(첫 심야버스 03:30 기준) — 그 뒤로는 따로 부르지 않는다.
  # 끝은 하루 시작 알림 기본값(08:00)이다 — 새벽에 고친 것을 하루 시작 알림이 싣는다.
  # 장소를 같은 곳으로 보는 거리는 **우리가 고른 값**이다(이름 검색 결과가 우리 좌표에서 이 안이어야 한다).
  # -- 채팅 질문의 규정 답 (2026-09-28, `trip_replies.question_reply`) --
  # ★규정 검색 점수가 이 값 이상인 조각만 답에 싣는다 — 관련 없는 조각을 답처럼 싣지 않는다.
  # ★출처: **우리가 고른 값**, 실측 근거 — 여행 규정 코퍼스(bge-m3)에서 관련 질문 7개의 1위 점수 0.498~0.695,
  #   관련 없는 말(인사·잡담) 7개 0.258~0.532(2026-09-28, 1회, 14개). 0.55 이면 관련 6/7 통과(못 넘은 하나는 엉뚱한
  #   조각이 걸린 경우) · 무관 0/7 통과. 표본이 작다 — 사람 라벨 질문셋으로 다시 정한다
  question:
    min_policy_score: 0.55
  # -- 채팅 기능 안내 (2026-10-14 사용자 지시 「추천대로」, `service_help.reply`) --
  # ★기능 안내 지식(`travel_service`)에서 이 점수 이상인 조각만 답에 싣는다. 규정 답(위 0.55)과 따로 둔다.
  # ★출처: **우리가 고른 값**, 실측 근거 — x600 서버(bge-m3)에서 기능 안내 질문 14개의 1위 점수 0.502~0.656,
  #   무관한 질문 14개 0.318~0.626(2026-10-14, 1회, 28개) — 점수만으로는 **갈리지 않는다**. 그래서 거르는 일은 앞 단계의
  #   해석 모델(할 일 「기능 안내」를 고르는 것)이 맡는다: 재생 434건에서 기능 안내를 고른 줄 학습 E4B 2/2 · 유료 대체 4/4 가
  #   정답도 기능 안내였다(잘못 고른 줄 0 — 표본이 작다). 0.55 면 기능 질문 14개 중 5개(「너 뭐 할 수 있어?」 0.502 등)가
  #   걸러져 「확인하지 못했어요」가 됐다. 0.45 는 기능 질문 14/14 를 최저점과 0.05 차이로 통과시킨다.
  service_help:
    min_score: 0.45
  # -- 일정 항목 짚기 가르친 모델 (2026-10-07 사용자 지시, `components/conversation/item_pointer.py`) --
  #   off: 낱말 규칙만 · shadow: 모델도 불러 규칙과의 차이만 기록하고 규칙 결과를 씀 · on: 모델 번호를 씀(실패하면 규칙으로 돌아감)
  #   ★`.env` 의 `ACOP_OLLAMA_POINTER_MODEL` 이 비어 있으면 이 값과 상관없이 규칙만 쓴다.
  #   ★출처: 가르친 Gemma-4 E4B(Q8) 가 질문 769개에서 750~760개(97.5~98.8%), 낱말 규칙은 같은 종류 90문제에서 33/90 = 37%(마스터 문서 §92 · §46).
  #   ★따옴표 필수 — YAML 은 맨 on 을 참(True)으로 읽는다.
  pointer:
    mode: "on"
  # -- 공지 「끝났나」 2차 확인 (2026-10-13 사용자 지시) — 규칙이 「끝남」이라 한 공지만 가르친 모델이 한 번 더 본다 --
  #   off: 규칙만 · shadow: 모델도 불러 다른 판정만 기록하고 규칙 결과를 쓴다 · on: 규칙과 모델이 둘 다 끝남일 때만 끝남
  #   ★모델 이름(`.env` 의 ACOP_OLLAMA_NOTICE_MODEL)이 비면 이 값과 상관없이 규칙만 쓴다. 모델을 못 부르면 규칙 결과를 쓴다(실패는 센다).
  #   ★출처: 서울 재난 문자 190건(정답 Claude)에서 잘못 끝남 규칙 5 · 둘 다 끝남일 때만 2, 놓침 0 · 0
  #    (final_project_cs/wiki/records/reports/2026-10-13_0100_끝남판정_규칙대모델_실수율.md). ★따옴표 필수 — YAML 은 맨 on 을 참으로 읽는다.
  notice_end:
    mode: "on"
  # -- 「기타」 · 모르는 구분 재난 문자의 여행 영향 2차 확인 (2026-10-13 사용자 결정 — 규칙 또는 모델) --
  #   off: 규칙만 · shadow: 모델도 불러 기록만 하고 규칙 결과를 쓴다 · on: 규칙이 영향 없음이라 한 것을 모델이 영향 있음으로 올릴 수 있다
  #   ★모델 이름(ACOP_OLLAMA_NOTICE_MODEL)이 비면 규칙만. 모델을 못 부르면 규칙 결과. 출처: 전국 holdout 99건 놓침 규칙 2 · 규칙 또는 모델 0
  notice_impact:
    mode: "on"
  # -- 결정 단위 (2026-09-29 사용자 지시 · Codex 합의) — 채팅을 여행 상태를 보며 모델 한 번으로 해석 --
  #   off: 옛 규칙 경로 · shadow: 결정만 Case 에 기록하고 답은 옛 경로 · on: 결정 단위로 처리(모델 실패에도 옛 경로로 안 넘김)
  #   ★전환 조건(계획 `wiki/records/plans/2026-09-29_1640_채팅_결정단위_실행계획.md`): 재생 시험에서 할 일+대상 95% 이상 ·
  #    엉뚱한 대상 변경 0건 · 지연 p95 5초 이하를 넘으면 on
  decision_unit:
    focus_ttl_seconds: 1800  # 로컬 수정 정책: 직전 사실 질문 대상의 자동 승계 유효 시간(30분). 장기 기억 보존 기간과 다름.
    # ★`[2026-09-29 Codex 3회차 합의]` 켠다 — 재생 129문장 95.3% · 엉뚱한 대상 0 · p95 4.5초. 옛 경로는 같은 실제 기록 66에서
    #  30건 안팎 오처리. 운영 설정 `chat.decision_mode` 로 재기동 없이 끈다. 오변경 의심(바꾼 뒤 15분 안 되돌림)이 1건이라도 나오면 shadow
    mode: "on"            # ★따옴표 필수 — YAML 은 맨 on 을 참(True)으로 읽는다(그래서 한 번 꺼진 채로 돌았다)
    num_predict: 1200    # 답 길이 상한(토큰). ★160 이면 되묻기 후보(choices)가 붙은 답이 중간에 잘려 JSON 이 깨졌다(재생 시험 2026-09-29) — 짧은 답은 일찍 끝나 지연이 거의 같다
  # -- 후보 이유 문장을 모델이 쓴다 (2026-10-07 사용자 결정, 마이그레이션 057 · `components/intake/reasons.py`) --
  # ★「이유 문장만 모델이 확인된 값으로 쓴다 — 보이는 후보 2~3개만, 결과 저장, 실패하면 지금의 틀 문장」. 모델은 **사실 목록만** 받고(이름 · 단 · 거리 · 영업 · 여유 · 일정의 장소),
  #   그 밖의 이름 · 숫자 · 평가를 쓴 문장은 검사(`guard`)가 버려 틀 문장으로 돌아간다. 출처: **우리가 고른 값**
  candidate_reason:
    enabled: true
    visible: 3             # 한 번에 모델이 쓰는 후보 수(화면에 먼저 보이는 것부터)
    budget_seconds: 6      # 이 안에 못 쓴 후보는 틀 문장을 쓰고, 모델 호출은 뒤에서 마저 끝나 저장된다(다음 요청부터 모델 문장)
    max_chars: 90
    prompt_version: "v1"   # 프롬프트를 바꾸면 올린다 — 저장된 문장의 열쇠에 들어간다
  # -- 끝난 여행의 전용 장소 행 정리 (2026-09-28, 마이그레이션 029 · `trip_places.py`) --
  # ★마지막 일정이 끝나고 이만큼 지나면 그 여행 전용 장소 행의 좌표·외부 식별자를 비운다(이름은 남긴다).
  #   늦은 신고(「어제 식당이 닫혀 있었다」)를 받아 볼 여유다. 출처: **우리가 고른 값**
  trip_place_retention_hours: 24
  dawn_check:
    start: "03:00"
    until: "08:00"
    match_radius_m: 300
  # -- 변경 초인종 (2026-09-30 사용자 승인 — `trip_events.py`, `GET /v1/web/trips/{id}/events`) --
  # 웹 화면이 「이 여행 바뀜」 신호만 받는다 — 내용은 웹이 지금 있는 조회로 다시 읽는다. 서버는 DB 의 커밋된 값을 읽기만 한다.
  # ★출처: **우리가 고른 값** — 2초면 사용자가 「바로」로 느끼고, 열린 연결 하나가 2초마다 가벼운 조회 셋을 한다.
  #   ping 20초는 중간 장비가 조용한 연결을 끊지 않게 하는 간격. 한 연결은 15분 뒤 서버가 닫는다(웹이 다시 붙고 전부 다시 읽는다 —
  #   놓친 신호를 되풀이하는 장치가 없는 대신 연결을 오래 쥐지 않는다). 사용자당 4연결(탭 둘 + 재연결 여유). DB 읽기가 연속 5번 실패하면 닫는다.
  trip_events:
    poll_seconds: 2
    ping_seconds: 20
    max_seconds: 900
    max_per_user: 4
    max_failures: 5
  # -- 감시 Case 재시도 (2026-10-02 결함 인계 #3 — `trip_watch_cases.py`) --
  # 일시 실패(점검 소스 실패 · 실행 예외)로 닫힌 Case 는 다음 회차가 다시 연다 — 같은 지문의 닫힌 Case 가 영원히 막지 않게. ★출처: **우리가 고른 값** —
  # 최대 3번(처음 포함 4번 시도) · 5분 이상 간격(감시가 1분마다 돌아 소스 실패가 길면 같은 요청을 1분마다 되풀이하지 않게). 그래도 안 되면 운영자 몫(escalated 로 남는다).
  watch:
    retry_max: 3
    retry_cooldown_seconds: 300
    # ★`[2026-10-03 사용자 지시]` 같은 여행에서 한 회차에 **둘 이상** 깨지면 Case 하나로 묶어 한 초안 위에서 차례로 고치고 판 하나 · 알림 하나로 낸다(`trip_watch_batch`). false 면 전처럼 항목마다 Case.
    batch_enabled: true
    # 한 묶음에 넣을 최대 항목 수 — 항목마다 도구 예산을 따로 쓰므로 오래 걸린다(Team 시간 제한 `reliability.team_timeout_seconds`). 넘는 항목은 **같은 회차에** 다음 묶음(또는 단일 Case)으로 연다.
    # ★출처: **우리가 고른 값**(측정 안 함) — 한 여행에서 90분 안에 시작하는 항목이 이보다 많이 깨지는 일은 드물다고 봤다.
    batch_max_items: 6
    # 분류 에이전트 계획 검증 상한. 자체 선택값이며 운영 품질 실측값이 아니다.
    plan_max_tool_calls: 72
    plan_priority_max: 10
    plan_max_input_chars: 24000
    plan_timeout_seconds: 12
    # 묶음 계산이 Team 시간 제한의 이 비율을 넘기면 **새 항목을 시작하지 않고** 남은 것은 다음 회차로 넘긴다(`retry`). Team 코드가 동기라 시간 제한이 도중에 끊지 못하므로 스스로 본다.
    # ★출처: **우리가 고른 값**(측정 안 함) — 마지막 항목 하나가 남은 40%(36초) 안에 끝난다고 봤다. 외부 점검 한 번이 최대 8초(`source_timeout_seconds`)다.
    batch_time_ratio: 0.6
    # ★`[2026-10-03 사용자 지적]` 감시가 대안을 못 찾거나(`no_alternate`) 찾은 안이 일정 전체 재판정에 다 걸렸을 때(`recheck_failed`) **조건을 풀어 비슷한 안**을 계산해 「그대로 두었어요 + 대신 이런 곳이 있어요」로 묻는다
    # (`watch_relaxed.py` — 시각 늦추기 · 다음 일정 근처 · 반경 넓히기, 셋까지. 자동 적용하지 않고 묻는다). 끄면 전처럼 곧바로 「일정은 그대로 두었어요」다.
    relaxed_enabled: true
  # -- 개인 AI 입구 (2026-10-02 사용자 지시 — `mcp_server.py`, `/mcp/`) --
  # 개인 AI(MCP)가 사용자 키로 **본인의 여행**을 다룬다. 읽기 도구(여행 목록·일정·알림·제안·등록 형식)는 늘 열려 있고, 쓰기 도구(말 걸기·신고·다른 안으로·
  # 제안 고르기·되돌리기·검증받고 등록·서버가 일정 짜기)는 이 스위치가 켜졌을 때만 등록된다. ★기본 꺼짐 — 프로젝트의 「MCP 는 read-only」 원칙(CLAUDE.md §0.2).
  # 켜도 바뀌는 것은 일정뿐이고(판마다 기록 · 되돌리기 가능) 결제 · 업체 예약은 건드리지 않는다. 바꾸면 서버를 다시 띄워야 반영된다.
  mcp:
    write_enabled: false
    # ★`[2026-10-06 사용자 요청]` 읽기 도구 「일정 위험 점검」(`GET /v1/web/trips/{id}/risks` · `tripilot_check_trip_risks`) — 외부 정보 6종(예보 · 특보 · 재난문자 · 교통 통제 · 대기질 · 지진).
    #   출처: 아래 값은 **우리가 고른 값**(측정 안 함). 기본(fresh 아님)은 감시가 모아 둔 공유 응답 캐시만 읽어 **바깥에 안 나간다** — 하루 한도(D-017 · `source_budget`)를 안 쓴다.
    # 입구마다 **동시에** 처리하는 수의 상한 — 넘으면 503 `busy`(하루 횟수 제한과 별개로 DB 연결 · 스레드를 지킨다). ★우리가 고른 값(측정 안 함)
    max_concurrent: {risk_check: 4, move_judge: 4}
    risk_check:
      horizon_hours: 3           # 「곧 시작할」 = 지금부터 이 시간 안(진행 중 포함). 감시는 90분 안을 3분마다 점검한다 — 그보다 넓게 두되 캐시가 비는 만큼 확인 불가가 늘어난다
      snapshot_hours: 3          # 시작이 이보다 멀면 특보 · 대기질 · 교통 · 재난문자 · 지진은 「지금 상태」만 말해 확인 불가(`too_early`)로 둔다 — 예보만 앞을 본다(대기질은 시각을 무시한다)
      max_items: 6               # 한 번에 점검하는 항목 수 — 감시 묶음 상한(`travel.watch.batch_max_items`)과 같다
      # fresh(캐시에 없으면 새로 부름) — 낮은 우선순위: 항목은 적게, 소스의 하루 · 이번 달 한도의 이 비율까지만 쓴다(나머지는 감시 · 채팅 몫 — 차감하는 SQL 안에서 비교).
      #   DB 를 못 읽으면 부르지 않는다(일반 호출의 `source_budget_on_db_error` 와 무관하게)
      fresh_max_items: 3
      fresh_share: 0.5
  # -- 라우팅 재배분 (2026-10-06) --
  # 분류가 붙인 대상 종류로 받는 팀이 없을 때, 등록된 팀이 **실제로 받는 종류** 안에서 한 번 더 고른다(`core_hooks/reroute.py`).
  # 끄면 종전대로 곧바로 escalated — 이 제품에는 사람 운영자 큐가 없어 그 Case 는 아무도 받지 않는다.
  # 모델 호출은 **라우팅이 실패한 Case 에만, Case 당 한 번**(목록 밖 답이면 되묻기 1회 포함 최대 2회).
  routing:
    reroute_enabled: true
  # -- 웹 실시간 진행 (2026-10-02 사용자 지시 — `op_stream.py`, 채팅·일정 짜기·접수 읽기를 SSE 로) --
  # 오래 걸리는 웹 일이 끝날 때까지 **아무것도 안 보이던** 문제 — 서버·모델이 멈추면 사용자가 자기 상태를 몰랐다. 서버는 단계(`stage`)와
  # 생존 신호(`beat`)를 계속 낸다. ★출처: **우리가 고른 값**. beat 3초 — 웹이 두 번(≈6초) 못 받으면 「연결이 끊겼어요」를 띄우기에 알맞고 가볍다.
  # slow 8초 — 깨어 있는 모델은 2초 안팎에 답한다(ui 세션 실측 2.0·2.1초) → 8초면 평소보다 확실히 느린 것이라 「모델이 느려요」를 알린다.
  # max_seconds — 채팅은 식은 모델 첫 호출 34초 + 모델 시간 제한 20초 여유로 90초, 일정 짜기는 생성기가 더 오래 걸려 240초, 접수 읽기는 사진·PDF 라 600초.
  # 한 사용자가 열 수 있는 실시간 작업 3개(채팅 · 일정 짜기 · 접수 읽기 동시). intake_stalled_seconds — 읽는 일꾼이 갱신 없이 이만큼 조용하면 죽은 것으로 본다.
  op_stream:
    beat_seconds: 3
    slow_seconds: 8
    max_per_user: 3
    max_seconds:
      message: 90
      plan: 240
      intake: 600
      consents: 60
    intake_poll_seconds: 1
    intake_stalled_seconds: 180
  # -- 고객 연락처 시험 발송 (2026-10-01 — `customer_profile.py`, `POST /v1/web/profile/discord/test`) --
  # 고객이 「시험 보내기」를 누를 때만 그 고객의 디스코드 웹훅으로 한 줄을 보낸다. ★출처: **우리가 고른 값** — 20초 간격이면 분당 최대 3회(ui 세션 요청),
  #  사람이 누르기에 충분하고 연타 · 남의 채널 도배(주소를 알면 누구나 쓸 수 있는 웹훅)를 막는다. 마지막 시도 시각은 DB 에서 센다(프로세스가 여럿이어도 맞다)
  profile:
    test_interval_seconds: 20
  # ★`[2026-10-05 사용자 지시]` 일정 변경 알림을 **고객이 연결한 곳**(디스코드 웹훅 · 텔레그램 대화 — `notice_channel`)으로 보낸다. ★기본 **꺼짐**(false) — 켜면 실제 고객에게 메시지가 나간다(사용자 승인 뒤에만).
  #   꺼져 있으면 외부 발송만 `skipped` 로 남기고 앱 알림을 유지한다. 개발용 디스코드로 우회하지 않는다. 켜져 있으면 고객이 연결한 한 곳으로만 보내며, 연결이 없거나 막혔으면 `skipped` 로 남긴다(`app/domains/travel_ops/components/watch/notice_routing.py`).
  notice_per_customer_enabled: false
  # -- 관광공사 목록 운영시간 새벽 읽기 (2026-09-29 사용자 지시 — 「장소 갱신은 새벽 3시, 요청은 DB 만」, 마이그레이션 036) --
  # ★처음 보는 곳 · 목록 수정 시각이 바뀐 곳만 읽는다. 관광지·문화시설·레포츠 먼저, 쇼핑은 뒤.
  # ★출처: **우리가 고른 값** — 관광공사 개발 계정은 하루 1,000건(데이터 포털 확인 2026-09-29). 하룻밤 600건이면 낮에 400건이
  #   남는다(일정 짜기 · 1분 장소 채우기 · 채팅 조회). 한 번에(한 틱) 10곳 — 1분 작업이 길게 물지 않게.
  #   못 읽은 곳은 retry_days 뒤에 다시 본다. 목록 5,832곳을 처음 다 읽는 데 약 10밤(추정)
  # ★`[2026-10-14 사용자 지시]` 시각은 아래 `daily_check`(03:00 시작 · 03:30 까지 끝내기 · 08:00 멈춤)를 따른다 — 이 블록의 start/until 은 같은 값으로 둔 기록이다.
  #   하루 몫(`per_night`)은 그날 03시부터 센다. `per_tick` 은 최소 양이고, 03:30 까지 끝나도록 `daily_check.max_per_tick` 까지 늘린다.
  #   ★관광공사 전체 목록은 매일 다시 받지 않는다 — 매일 다시 읽는 것은 **고객이 일정에 넣은 장소**뿐이다(`place_info.fill_missing_facts`, 사용자 지시 2026-10-14).
  catalog_hours:
    start: "03:00"
    until: "08:00"
    per_night: 600
    per_tick: 10
    retry_days: 7
  # -- 에이전트 팀 정기 작업의 시간대 (2026-10-13 — 활동 → 코어 전달 사항 2번) --
  # ★팀은 `instances/<팀>/jobs.py` 의 `TeamJob(window=...)` 로 이름만 고르고, 시각은 여기서 정한다(서울 시각, until 은 들지 않는다).
  # ★`dawn` = 새벽 정기 점검 시간대 — 아래 `daily_check` 와 같은 값(03:00 시작 · 08:00 멈춤)으로 둔다. `[2026-10-14 사용자 지시]`
  #   ★팀 작업은 결과에 `remaining`(오늘 남은 건수)을 실어야 03:30 「안 끝남」 보고에 들어간다(`watch/daily_check.py`). 안 실으면 「모름」으로 센다.
  team_jobs:
    windows:
      dawn:
        start: "03:00"
        until: "08:00"
  # -- 일일 정기점검 (2026-10-14 사용자 지시 — 「3시 시작, 가능하면 3시 30분까지 마감, 안 끝나면 관리자 웹앱에 보고, 8시에는 모두 멈춤 — 지금처럼」) --
  # ★새벽 작업(일정에 넣은 장소 다시 읽기 · 관광공사 운영시간 읽기 · 식당 새벽 확인 · 팀 정기 작업)의 시각을 한 곳에 둔다(`watch/daily_check.py`).
  #   `finish_by` 까지 끝나도록 한 번에 하는 양을 늘리고(많아야 `max_per_tick` — 관광공사 몰림 허용 30 안), 그 시각이 지난 첫 회차에 남은 일이 있으면
  #   관리자 웹앱 「운영 진단」에 `DAILY_CHECK_OVERDUE` 를 하루 한 건 남긴다. `stop` 이 지나면 모두 멈춘다(남은 일은 다음 날로 넘어간다).
  #   ★식당 새벽 확인(`dawn_check`) · 팀 작업(`team_jobs.windows.dawn`)의 시각은 아직 각 블록이 읽는다 — 바꿀 때는 셋을 같이 바꾼다.
  # ★출처: 시각은 **사용자 지시**, `max_per_tick` 은 **우리가 고른 값**(600곳 ÷ 30분 = 분당 20곳 + 여유).
  daily_check:
    start: "03:00"
    finish_by: "03:30"
    stop: "08:00"
    max_per_tick: 25
  # -- 구글 호출 예산 (2026-09-25 사용자 지시: 무료 한도를 **무조건** 넘지 않는다) --
  # ★키는 지도 API 전체에 열어 두고(나중에 경로·지오코딩 등을 쓸 수 있다), 제한은 **여기서 요금 단위마다** 건다.
  #   표에 없는 요금 단위는 **부르지 않는다**(`call_budget.CallBudget` — 한도를 모르면 막는다).
  # 무료 한도 = 공식 요금표의 「free usage cap」(월) `[확인 2026-09-25]`
  #   https://developers.google.com/maps/billing-and-pricing/pricing — null 은 무제한(세기만 한다).
  # ★상한 규칙(코드가 계산한다): **하루 = 무료 ÷ 32(내림), 월 = 무료 − 하루.**
  #   월 경계 시간대를 구글이 적어 두지 않았다 → UTC 월로 세고 월 + 하루 ≤ 무료 한도로 둔다
  #   (경계가 하루 어긋나 두 달에 걸쳐 세어져도 넘지 않게). 예: 1,000 → 하루 31 · 월 969.
  # 실패한 호출도 한 칸으로 센다(보수적). DB(`external_call_budget`, 027)에서 모든 프로세스가 같이 센다.
  # ★요금표가 바뀌면 이 표만 고친다. 호출하는 코드는 자기 요금 단위 이름만 안다.
  # -- 식당 대안의 구글 가격 조회 스위치 (2026-10-05) --
  # 켜면 대안 식당을 세울 때 구글 Places 에서 가격(가격 범위 · 가격대)을 받아 **비교에만** 쓰고 버린다(저장하지 않는다).
  # ★기본은 꺼짐 — 식당을 가격으로 순위 매기거나 떨어뜨리지 않는다(2026-09-28 결정). 팀 코드는 켜져 있는 것을 기본으로
  #   가정하지만 우리는 끈 채로 둔다. 이 호출은 하루 상한 없이 월 줄에 세기만 하고 무료 한도를 넘어도 부른다(`CallBudget.count`)
  #   — 그래서 켜는 것은 사람이 정한다. 읽는 곳: `app.core.settings.google_price_enabled()`.
  # ★`[2026-10-13 사용자 지시]` 유료 결제 뒤 **관리 콘솔 「운영 설정」에서 켠다**(같은 이름의 참/거짓 스위치).
  #   콘솔에서 바꾼 값이 먼저고, 이 값은 콘솔 값이 없을 때의 기본이다. 실제로 읽는 곳: `settings_hook.google_price_enabled(tenant)`.
  dining:
    google_price_enabled: false
    # -- 요식 판정 에이전트 그림자 운행 (2026-10-13 · 설계 §10 단계 5) --
    # 접수 확인의 규칙 검사와 나란히 에이전트(LLM 이 체크를 고르고 규칙 도구를 인용)가 판정하고 `dining.dn_agent_shadow`(232)에 남긴다.
    # ★고객 결과는 바뀌지 않는다(기록만) · 새벽 확인에는 쓰지 않는다. ★기본 꺼짐 — 모델 호출 비용이 들어 켜는 것은 사람이 정한다.
    # model = openai:<모델>(키 ACOP_OPENAI_API_KEY) · ollama:<모델>(주소 ACOP_OLLAMA_BASE_URL). 읽는 곳: `app.core.settings.dining_agent_shadow()`.
    agent_shadow:
      enabled: false
      model: "openai:gpt-4o-mini"
      deadline_s: 120
  # -- 확인 화면의 「택시 호출 상품」 고르기 (2026-10-14 사용자 지시 · 핫픽스) --
  # 택시 요금(호출 상품별 이용료) 계산이 아직 믿을 만하지 않아 고객 화면의 상품 고르기 칸을 **기본 꺼짐**으로 둔다.
  # 꺼짐: 검사 응답에 `taxi_pricing` 을 싣지 않아 칸이 사라지고, 고르기 요청(`trip.taxi_pricing`)은 거절하고, 이미 저장된 고른 값은 계산에 쓰지 않는다.
  # **관리 콘솔 「운영 설정」** 의 같은 이름 스위치로 켠다(콘솔 값이 먼저). 읽는 곳: `settings_hook.taxi_call_product_enabled(tenant)`.
  mobility:
    taxi_call_product_enabled: false
  # -- 여행 화면 「지금 HH:MM」 시각 표시 (2026-10-15 사용자 결정 · ST4F-494) --
  # 여행 화면 일정 줄의 빨간 「지금」 점 옆 시각 꼬리표. 시험 기간에 확인하려고 **기본 켜짐**, 배포 때 **관리 콘솔 「운영 설정」** 의 같은 이름 스위치로 끈다(콘솔 값이 먼저).
  # 꺼짐: 여행 조회 응답의 `now_label` 이 false — 화면은 점만 보인다. 읽는 곳: `settings_hook.trip_now_label_enabled(tenant)`.
  trip_screen:
    now_label_enabled: true
  # -- 카카오 호출 예산 (2026-09-27) --
  # 키워드 검색 무료 한도는 하루 100,000건이지만 처음 켠 앱 하나에만 준다 — 한도 초과 사용 자체가 약관 위반이라
  # 설정의 하루 상한(ACOP_RATE_KAKAO_PER_DAY=1000)과 같은 값으로 DB 예산을 건다(모든 프로세스가 같이 센다).
  kakao_budget:
